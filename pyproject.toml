[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzle-cracker"
version = "0.1.0"
description = "Puzzle-cracking harness for the CayleyPy Kaggle competition family (Rubik's cube, Megaminx, graph puzzles): data access, solvers, scoring, and the simple elegant algorithm artifact."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "visualcomments" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
    "kaggle>=1.5.13",
]

[project.optional-dependencies]
cayleypy = ["cayleypy>=0.1", "torch"]
tests = ["pytest>=7"]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
include = ["puzzle_cracker*"]

[tool.setuptools.package-data]
puzzle_cracker = ["py.typed"]